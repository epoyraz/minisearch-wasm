[package]
name = "minisearch-wasm"
version = "0.12.0"
edition = "2021"
license = "MIT"
description = "Rust and WebAssembly full-text search engine inspired by MiniSearch"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The engine's own JavaScript API, beyond what the public facade calls: the
# document, search and serialization methods the engine test suites drive.
# The published package is built without it (see scripts/build-core.mjs).
core-api = []

[dependencies]
js-sys = "0.3"
# Fast, deterministic hasher for the transient per-query result maps (integer
# doc-id keys). std's SipHash is overkill for these and dominates accumulation.
rustc-hash = "2"
serde = { version = "1", features = ["derive", "rc"] }
# `float_roundtrip`: parse decimals from JSON text with correct rounding, like
# JS `JSON.parse`, so field values and ids stringify identically to JS.
# `unbounded_depth`: the JSON snapshot reader bounds nesting itself, to the
# radix depth the binary format allows (see `MAX_JSON_NESTING`).
# `raw_value`: an externally identified index hands MiniSearch JSON's document
# ids and stored fields to JavaScript as text, for `JSON.parse` there.
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth", "raw_value"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
serde_json = "1"

# Maximize runtime speed of the generated Wasm. The search path is hot and the
# crate is small, so whole-program LTO + a single codegen unit are cheap wins.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
