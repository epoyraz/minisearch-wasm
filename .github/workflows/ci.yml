name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain, its components and the
      # wasm32-unknown-unknown target; rustup installs them on first use.
      - name: Rust toolchain
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/.wasm-pack
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # scripts/finalize-pkg.mjs is written against this wasm-pack (and the
      # wasm-bindgen that Cargo.lock pins, which wasm-pack installs to match).
      - name: wasm-pack 0.15.0
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo install wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      # Native checks, the native differential, then every suite against pkg/.
      - run: npm test
